name: deploy

# merges to main are checked again, then published to AWS
on:
  push:
    branches: [main]
  workflow_dispatch:

# jobs default to reading the repository
# deployment separately requests OIDC
permissions:
  contents: read

# production runs finish publishing before the next run starts
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy-frontend:
    name: deploy frontend
    needs: checks
    if: ${{ github.repository_id == '1453313892' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      FRONTEND_BUCKET: solo101-frontend-knvs-awp-391742238993-us-east-2-an
      CLOUDFRONT_DISTRIBUTION_ID: E1X521FL3327X8
      FRONTEND_URL: https://d3w0xbq9l7a6rf.cloudfront.net

    steps:
      - name: download the checked frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend-dist

      # only this job requests temporary AWS credentials
      # the trust policy restricts the role to this repository's main branch
      - name: authenticate to AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::391742238993:role/solo101-frontend-deploy-role
          allowed-account-ids: '391742238993'
          role-session-name: frontend-${{ github.run_id }}
          role-duration-seconds: 900

      - name: upload assets before publishing the homepage
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend-dist/index.html
          aws s3 sync frontend-dist/ "s3://$FRONTEND_BUCKET/" \
            --exclude "index.html" \
            --cache-control "public,max-age=300" \
            --only-show-errors
          # retain previous assets so already-open pages can still load them
          aws s3 cp frontend-dist/index.html "s3://$FRONTEND_BUCKET/index.html" \
            --content-type "text/html" \
            --cache-control "no-cache" \
            --only-show-errors

      - name: refresh CloudFront and verify the published homepage
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 \
            "$FRONTEND_URL/index.html" --output "$RUNNER_TEMP/deployed-index.html"
          cmp frontend-dist/index.html "$RUNNER_TEMP/deployed-index.html"

  deploy-backend:
    name: deploy backend
    needs: checks
    if: ${{ github.repository_id == '1453313892' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      BACKEND_INSTANCE_NAME: solo101-backend

    steps:
      # the trust policy restricts the role to this repository's main branch
      - name: authenticate to AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::391742238993:role/solo101-backend-deploy-role
          allowed-account-ids: '391742238993'
          role-session-name: backend-${{ github.run_id }}
          role-duration-seconds: 1800

      # the server fetches this exact commit, builds it, and restarts the service
      # it rolls back to the previous release if the health check fails
      - name: build and restart the backend on EC2
        shell: bash
        run: |
          set -euo pipefail
          instance_id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$BACKEND_INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ "$(wc -w <<< "$instance_id")" != 1 ]; then
            echo "expected one running $BACKEND_INSTANCE_NAME instance" >&2
            exit 1
          fi

          parameters=$(jq -n --arg sha "$GITHUB_SHA" '{
            commands: [
              "set -eu",
              "cd /home/ssm-user/solo101-build",
              ("runuser -u ssm-user -- env HOME=/home/ssm-user git fetch --quiet --depth 1 origin " + $sha),
              "runuser -u ssm-user -- env HOME=/home/ssm-user git checkout --quiet --detach FETCH_HEAD",
              "bash infra/ec2/deploy-backend.sh"
            ],
            executionTimeout: ["900"]
          }')
          command_id=$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::12}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)

          status=Pending
          for _ in $(seq 1 100); do
            sleep 10
            # the invocation can take a few seconds to appear after sending
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance_id" \
              --query Status --output text 2> /dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$instance_id" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "deployment status: $status"
          test "$status" = Success
