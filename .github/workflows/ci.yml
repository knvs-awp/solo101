name: project checks

# pull requests check whether the proposed changes build together with main
# the deploy workflow reuses these checks before publishing
on:
  pull_request:
  workflow_call:

# jobs default to reading the repository
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # a newer push to the same pull request replaces superseded checks
    concurrency:
      group: checks-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      # the commit hashes pin the action code, and the version labels identify the
      # releases they came from so updates can be reviewed explicitly later
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # this caches downloaded npm packages, while npm ci still creates a fresh
          # node_modules directory from the committed workspace lockfile on every run
          cache: npm
          cache-dependency-path: package-lock.json

      # running from the repository root installs all workspaces, and npm
      # ci fails if package.json and the lockfile disagree instead of updating the lockfile
      - name: install dependencies
        run: npm ci

      - name: check types
        run: npm run typecheck

      - name: build workspaces
        run: npm run build

      - name: save frontend build for deployment
        if: ${{ github.repository_id == '1453313892' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 3
