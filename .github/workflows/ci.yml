name: project checks

# pushes check the code on each branch, while pull requests also check whether the
# proposed changes build together with the branch they are being merged into
on:
  push:
  pull_request:
  workflow_dispatch:

# jobs default to reading the repository
# deployment separately requests OIDC
permissions:
  contents: read

# production runs finish publishing
# other branches replace superseded checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # the commit hashes pin the action code, and the version labels identify the
      # releases they came from so updates can be reviewed explicitly later
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # this caches downloaded npm packages, while npm ci still creates a fresh
          # node_modules directory from the committed workspace lockfile on every run
          cache: npm
          cache-dependency-path: package-lock.json

      # running from the repository root installs all workspaces, and npm
      # ci fails if package.json and the lockfile disagree instead of updating the lockfile
      - name: install dependencies
        run: npm ci

      - name: check types
        run: npm run typecheck

      - name: build workspaces
        run: npm run build

      - name: save frontend build for deployment
        if: ${{ github.repository_id == '1453313892' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 3

  deploy-frontend:
    name: deploy frontend
    needs: checks
    if: ${{ github.repository_id == '1453313892' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      FRONTEND_BUCKET: solo101-frontend-knvs-awp-391742238993-us-east-2-an
      CLOUDFRONT_DISTRIBUTION_ID: E1X521FL3327X8
      FRONTEND_URL: https://d3w0xbq9l7a6rf.cloudfront.net

    steps:
      - name: download the checked frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend-dist

      # only this job requests temporary AWS credentials
      # the trust policy restricts the role to this repository's main branch
      - name: authenticate to AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::391742238993:role/solo101-frontend-deploy-role
          allowed-account-ids: '391742238993'
          role-session-name: frontend-${{ github.run_id }}
          role-duration-seconds: 900

      - name: upload assets before publishing the homepage
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend-dist/index.html
          aws s3 sync frontend-dist/ "s3://$FRONTEND_BUCKET/" \
            --exclude "index.html" \
            --cache-control "public,max-age=300" \
            --only-show-errors
          # retain previous assets so already-open pages can still load them
          aws s3 cp frontend-dist/index.html "s3://$FRONTEND_BUCKET/index.html" \
            --content-type "text/html" \
            --cache-control "no-cache" \
            --only-show-errors

      - name: refresh CloudFront and verify the published homepage
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 \
            "$FRONTEND_URL/index.html" --output "$RUNNER_TEMP/deployed-index.html"
          cmp frontend-dist/index.html "$RUNNER_TEMP/deployed-index.html"
